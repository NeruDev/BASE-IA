# =============================================================================
# PRE-COMMIT HOOKS CONFIGURATION (Quality Gates Nivel 4)
# =============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-manifest
        name: Validate Repository Manifest
        entry: python validators/validate_manifest.py
        language: system
        pass_filenames: false
        files: ^(repo_manifest\.jsonc|profiles/.*|modules/.*)

      - id: validate-metadata
        name: Validate Frontmatter Metadata
        entry: python validators/validate_metadata.py
        language: system
        types: [markdown]

      - id: validate-architecture
        name: Validate Architectural Import Boundaries
        entry: python validators/validate_architecture.py
        language: system
        types: [python]
