name: Continuous Integration & Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  audit-and-validate:
    name: Validate Manifest, Metadata & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml ruff pytest

      - name: Validate Composition Manifest
        run: python validators/validate_manifest.py

      - name: Validate Markdown YAML Frontmatter
        run: python validators/validate_metadata.py

      - name: Validate Architectural Boundaries
        run: python validators/validate_architecture.py

      - name: Run Linters & Static Analysis
        run: ruff check .

      - name: Run Test Suite
        run: pytest -v
