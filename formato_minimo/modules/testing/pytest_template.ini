[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    -ra
    --showlocals
    --tb=short
markers =
    unit: Pruebas unitarias puras y aisladas sin I/O
    integration: Pruebas de integración entre capas y módulos
    slow: Pruebas de larga duración o carga de datasets
    architecture: Pruebas de validación de límites arquitectónicos e imports
filterwarnings =
    error
    ignore::DeprecationWarning
